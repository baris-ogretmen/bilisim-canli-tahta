<!doctype html>
<html lang="tr" data-tema="selale">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04161D">
<title>Bilişim Sınıfı · Canlı Tahta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ============ TEMALAR ============ */
:root{
  --L: 8.6vw;           /* soldaki masaüstü simgeleri için boş şerit */
  --B: 5.2vh;           /* alttaki görev çubuğu için boşluk */
  --disp: 'Baloo 2', 'Segoe UI Rounded', 'Segoe UI', system-ui, sans-serif;
  --govde: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  --paper:#F7F3E8; --sun:#FFD24A; --coral:#FF7A6B; --mint:#8CF0B5;
}
[data-tema="selale"]{ --bg1:#04161D; --bg2:#0B3A47; --water:95,227,224; --glow:#5FE3E0; --rock:#020C10; --rock2:#0A2A31; --ink:#EAFBFA; }
[data-tema="gunbatimi"]{ --bg1:#170A1F; --bg2:#5B1F3D; --water:255,196,150; --glow:#FFB27A; --rock:#0C0410; --rock2:#2A0F24; --ink:#FFF4EC; }
[data-tema="uzay"]{ --bg1:#060823; --bg2:#26165E; --water:176,158,255; --glow:#A996FF; --rock:#03041A; --rock2:#14104A; --ink:#F1EEFF; }

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg1);color:var(--ink);font-family:var(--govde);-webkit-font-smoothing:antialiased}
body{overflow:hidden}

/* ============ TAHTA ============ */
#tahta{position:fixed;inset:0;overflow:hidden;
  background:radial-gradient(110% 90% at 78% 28%, var(--bg2) 0%, var(--bg1) 62%), var(--bg1);}
.aurora{position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:screen;animation:suzul 40s ease-in-out infinite alternate}
.a1{width:70vw;height:46vh;left:30vw;top:-16vh;background:radial-gradient(closest-side, rgba(var(--water),.42), transparent);}
.a2{width:50vw;height:50vh;left:-8vw;bottom:-18vh;background:radial-gradient(closest-side, rgba(255,122,107,.20), transparent);animation-duration:52s}
.a3{width:36vw;height:36vh;left:28vw;top:30vh;background:radial-gradient(closest-side, rgba(140,240,181,.10), transparent);animation-duration:34s}
@keyframes suzul{to{transform:translate(-5vw,4vh) scale(1.12)}}
#cv{position:absolute;inset:0;width:100%;height:100%}
.sol-perde{position:absolute;left:0;top:0;bottom:0;width:calc(var(--L) + 3vw);
  background:linear-gradient(90deg, rgba(0,0,0,.42), rgba(0,0,0,.18) 60%, transparent);pointer-events:none}
#fotoKatman{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}

/* üst şerit */
.ust{position:absolute;top:3vh;left:calc(var(--L) + 3vw);right:2.6vw;display:flex;align-items:flex-start;justify-content:space-between;gap:2vw;z-index:6}
.marka{display:flex;gap:1vw;align-items:center}
.marka-ikon{width:3.6vw;height:3.6vw;border-radius:1vw;background:var(--sun);color:#2a1d00;display:grid;place-items:center;
  font:800 1.35vw/1 var(--disp);transform:rotate(-6deg);box-shadow:0 .6vw 1.6vw rgba(255,210,74,.35)}
.marka b{display:block;font:800 1.9vw/1 var(--disp);letter-spacing:.01em}
.marka small{display:block;font:700 .95vw/1.2 var(--govde);opacity:.72;margin-top:.35vh}
#pin{margin-top:1.4vh;display:none;align-items:center;gap:.6vw;max-width:40vw;padding:.7vh 1.1vw;border-radius:.8vw;
  background:rgba(255,210,74,.14);border:1px solid rgba(255,210,74,.45);font:800 1.05vw/1.25 var(--disp);color:var(--sun)}
#pin.var{display:flex}
#pin span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saat{text-align:right}
.saat b{display:block;font:800 3.8vw/.9 var(--disp);letter-spacing:.02em;text-shadow:0 0 2vw rgba(var(--water),.45)}
.saat small{display:block;font:700 1.02vw/1.3 var(--govde);opacity:.78;margin-top:.6vh}
.saat .sinif-cip{display:inline-block;margin-top:1vh;padding:.45vh .9vw;border-radius:99px;background:var(--sun);color:#2a1d00;font:800 1vw/1.3 var(--disp)}

/* sahne */
.sahne{position:absolute;left:calc(var(--L) + 3vw);top:16vh;width:45vw;bottom:calc(var(--B) + 8vh);z-index:4}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:2.2vh;animation:sgir .9s cubic-bezier(.2,.8,.2,1) both}
.scene.cikis{animation:scik .6s ease forwards}
@keyframes sgir{from{opacity:0;transform:translateY(3vh)}}
@keyframes scik{to{opacity:0;transform:translateY(-2.5vh)}}
.ilerleme{position:absolute;left:calc(var(--L) + 3vw);width:22vw;bottom:calc(var(--B) + 4.6vh);height:.55vh;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;z-index:4}
.ilerleme i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sun),var(--coral));border-radius:99px}
@keyframes dol{to{width:100%}}

.cip{align-self:flex-start;display:inline-flex;gap:.6vw;align-items:center;padding:.7vh 1.3vw .7vh .8vw;border-radius:99px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);font:800 1.3vw/1.2 var(--disp)}
.cip .em{font-size:1.7vw;line-height:1}
h1.dev{font:800 5.6vw/1 var(--disp);margin:0;color:var(--ink);text-wrap:balance;text-shadow:0 .4vw 2.6vw rgba(var(--water),.4)}
.kelime{display:inline-block;white-space:nowrap}
.harf{display:inline-block;animation:harf .75s cubic-bezier(.2,1.6,.4,1) both}
@keyframes harf{from{opacity:0;transform:translateY(.55em) scale(.55) rotate(-10deg)}}
.lead{font:700 1.95vw/1.38 var(--govde);max-width:32ch;opacity:.92;margin:0}

.ogretmen{display:flex;align-items:center;gap:1.4vw;margin-top:1.2vh}
.avatar{width:10vw;height:10vw;border-radius:50%;position:relative;flex:none}
.avatar::before{content:'';position:absolute;inset:-.45vw;border-radius:50%;
  background:conic-gradient(var(--sun),var(--coral),var(--glow),var(--mint),var(--sun));animation:don 7s linear infinite}
.avatar .ic{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:var(--bg2);display:grid;place-items:center;font-size:4.6vw;border:.38vw solid var(--bg1)}
.avatar img,.avatar video{width:100%;height:100%;object-fit:cover;display:block}
@keyframes don{to{transform:rotate(360deg)}}
.ogretmen b{display:block;font:800 2.1vw/1 var(--disp)}
.ogretmen small{display:block;font:700 1.05vw/1.3 var(--govde);opacity:.75;margin-top:.6vh}

.etiket{display:flex;align-items:center;gap:.8vw;font:800 1.55vw/1.2 var(--disp);color:var(--sun)}
.buyuk{font:800 3.6vw/1.12 var(--disp);margin:0;text-wrap:balance;max-width:20ch}
.tik{width:4.2vw;height:4.2vw;border-radius:1vw;border:.32vw solid var(--mint);display:grid;place-items:center;flex:none}
.tik svg{width:70%;height:70%;stroke:var(--mint);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:ciz .7s 1.4s ease forwards}
@keyframes ciz{to{stroke-dashoffset:0}}
.gorev-satir{display:flex;align-items:center;gap:1.6vw}

.ipucu-ust{display:flex;align-items:center;gap:1.4vw}
.ikon-tas{width:7.4vw;height:7.4vw;border-radius:2vw;display:grid;place-items:center;font:800 3.8vw/1 var(--disp);
  background:linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.22);transform:rotate(-5deg);animation:salla 4s ease-in-out infinite}
@keyframes salla{50%{transform:rotate(4deg) translateY(-.6vh)}}
.ipucu-metin{font:800 2.7vw/1.22 var(--disp);margin:0;max-width:26ch;text-wrap:pretty}

.cerceve{position:relative;margin:0;align-self:flex-start;background:var(--paper);padding:1vw 1vw 4.4vw;border-radius:.4vw;transform:rotate(-2.2deg);box-shadow:0 2vw 4vw rgba(0,0,0,.5)}
.cerceve .foto{width:36vw;height:50vh;overflow:hidden;background:#d9d4c7}
.cerceve img,.cerceve video{width:100%;height:100%;object-fit:cover;display:block}
.cerceve img{animation:kenburns 16s ease-out both}
@keyframes kenburns{from{transform:scale(1.18) translate(2%,1%)}to{transform:scale(1) translate(0,0)}}
.cerceve figcaption{position:absolute;left:1vw;right:1vw;bottom:1.1vw;color:#23302f;font:800 1.75vw/1.1 var(--disp);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bant{position:absolute;top:-1.3vw;left:50%;width:9vw;height:2.6vw;background:rgba(255,210,74,.78);transform:translateX(-50%) rotate(3deg);box-shadow:0 .2vw .5vw rgba(0,0,0,.15)}

.dongu-wrap{display:flex;align-items:center;gap:3vw}
.halka{position:relative;width:23vw;height:23vw;flex:none}
.halka::before{content:'';position:absolute;inset:3.2vw;border-radius:50%;border:.3vw dashed rgba(255,255,255,.18);animation:don 40s linear infinite}
.dugum{position:absolute;width:5.6vw;height:5.6vw;margin:-2.8vw 0 0 -2.8vw;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);font:800 2vw/1 var(--disp);transition:transform .5s cubic-bezier(.2,1.6,.4,1), background .4s, box-shadow .4s}
.dugum.aktif{transform:scale(1.32);background:var(--sun);color:#2a1d00;box-shadow:0 0 2.4vw rgba(255,210,74,.6)}
.dugum.gecti{background:rgba(var(--water),.25)}
.halka .orta{position:absolute;inset:6vw;border-radius:50%;display:grid;place-items:center;text-align:center;font:800 1.9vw/1 var(--disp);color:var(--sun)}
.dongu-adim b{display:block;font:800 4.4vw/1 var(--disp)}
.dongu-adim p{font:700 1.9vw/1.35 var(--govde);margin:1.2vh 0 0;opacity:.9;max-width:18ch}

.not-kart{align-self:flex-start;background:var(--sun);color:#2b2100;border-radius:.7vw;padding:3.4vh 2.6vw;transform:rotate(-1.6deg);
  box-shadow:0 2vw 4vw rgba(0,0,0,.45);max-width:40vw;position:relative}
.not-kart::after{content:'';position:absolute;top:-1.2vw;left:2vw;width:2.4vw;height:2.4vw;border-radius:50%;background:var(--coral);box-shadow:inset -.3vw -.3vw 0 rgba(0,0,0,.2)}
.not-kart small{font:800 1.3vw/1 var(--disp);opacity:.75}
.not-kart p{font:800 3.1vw/1.16 var(--disp);margin:.8vh 0 0;text-wrap:balance}

/* düşen fotoğraflar */
.polar{position:absolute;top:0;left:0;width:11.5vw;background:var(--paper);padding:.55vw .55vw 2.2vw;border-radius:.3vw;box-shadow:0 1.2vw 2.6vw rgba(0,0,0,.45);will-change:transform,opacity}
.polar img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#ddd}
.polar.vid::after{content:'▶';position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:3vw;height:3vw;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font-size:1.2vw;padding-left:.2vw}
.polar span{position:absolute;left:.5vw;right:.5vw;bottom:.5vw;text-align:center;font:800 .95vw/1.1 var(--disp);color:#2a3433;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kabarcik{position:absolute;top:0;left:0;width:7vw;height:7vw;border-radius:50%;display:grid;place-items:center;font:800 3.2vw/1 var(--disp);color:var(--ink);
  background:radial-gradient(circle at 30% 28%, rgba(255,255,255,.4), rgba(255,255,255,.06) 62%);border:1px solid rgba(255,255,255,.32);will-change:transform,opacity}

/* katmanlar: yeni foto, gösteri, sessiz */
.katman{position:absolute;left:var(--L);right:0;top:0;bottom:var(--B);display:grid;place-items:center;z-index:20;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .5s, visibility .5s;
  background:radial-gradient(70% 70% at 50% 50%, rgba(0,0,0,.8), rgba(0,0,0,.55) 65%, rgba(0,0,0,.25))}
.katman.acik{opacity:1;visibility:visible}
.katman-ic{text-align:center;display:flex;flex-direction:column;align-items:center}
.katman h2{font:800 3.6vw/1.05 var(--disp);margin:0 0 4vh;text-shadow:0 .4vw 2vw rgba(0,0,0,.4)}
.katman p{font:700 1.9vw/1.35 var(--govde);margin:1.6vh 0 0;opacity:.9}
.katman .dev-emoji{font-size:9vw;line-height:1;animation:zipla 1s cubic-bezier(.2,1.6,.4,1) infinite alternate}
@keyframes zipla{to{transform:translateY(-2vh) scale(1.06)}}
.katman.acik .cerceve{animation:pop .8s cubic-bezier(.2,1.6,.4,1) both}
.katman .cerceve{align-self:center;transform:rotate(1.5deg)}
.katman .cerceve .foto{width:auto;height:56vh;aspect-ratio:4/3}
@keyframes pop{from{transform:scale(.4) rotate(-14deg);opacity:0}}
.sayac{font:800 7vw/1 var(--disp);color:var(--sun);margin-top:1vh;font-variant-numeric:tabular-nums}
.nefes{width:18vw;height:18vw;border-radius:50%;background:radial-gradient(circle, rgba(var(--water),.55), rgba(var(--water),.08) 70%);
  border:.3vw solid rgba(var(--water),.6);display:grid;place-items:center;font-size:6vw;animation:nefes 8s ease-in-out infinite}
@keyframes nefes{0%,100%{transform:scale(.78)}50%{transform:scale(1.08)}}
#sessizKatman{background:radial-gradient(60% 60% at 50% 50%, rgba(0,0,0,.5), transparent)}
body.sessiz .sahne, body.sessiz .ilerleme{opacity:0;transition:opacity .8s}
.nefes-yazi{font:800 2vw/1 var(--disp);margin-top:3vh;opacity:.85}

#disli{position:absolute;right:1.2vw;bottom:calc(var(--B) + 1.6vh);z-index:30;width:3vw;height:3vw;min-width:40px;min-height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.3);
  background:rgba(0,0,0,.35);color:#fff;font-size:1.4vw;cursor:pointer;opacity:0;transition:opacity .4s}
body.fare #disli{opacity:.85}
#disli:focus-visible{opacity:1;outline:3px solid var(--sun)}

/* ============ KUMANDA PANELİ ============ */
#panelKatman{position:fixed;inset:0;z-index:100;background:rgba(2,8,10,.72);display:none;overflow:auto;-webkit-overflow-scrolling:touch}
#panelKatman.acik{display:block}
body.panel-modu{overflow:auto}
body.panel-modu #tahta{display:none}
body.panel-modu #panelKatman{position:static;display:block;background:radial-gradient(120% 60% at 80% 0%, var(--bg2), var(--bg1) 70%);min-height:100vh}
.pn{max-width:560px;margin:0 auto;padding:max(16px, env(safe-area-inset-top)) 16px max(40px, env(safe-area-inset-bottom));font-size:16px}
.pn header{display:flex;align-items:center;gap:12px;padding:8px 0 14px}
.pn-logo{width:48px;height:48px;border-radius:14px;background:var(--sun);color:#2a1d00;display:grid;place-items:center;font:800 18px var(--disp);transform:rotate(-6deg);flex:none}
.pn h2{font:800 24px/1 var(--disp);margin:0}
.pn header p{margin:4px 0 0;font-size:13px;opacity:.75}
.pn-kapat{margin-left:auto;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:transparent;color:inherit;font-size:20px;cursor:pointer}
.pn section{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:16px;margin-bottom:12px}
.pn h3{font:800 18px/1.2 var(--disp);margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.pn h3 small{font:700 13px var(--govde);opacity:.7}
.pn-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pn button,.pn .pn-btn{font:800 15px/1.2 var(--disp);color:var(--ink);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:12px 10px;cursor:pointer;min-height:46px;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;-webkit-tap-highlight-color:transparent}
.pn button:active,.pn .pn-btn:active{transform:scale(.97)}
.pn button:focus-visible,.pn .pn-btn:focus-within{outline:3px solid var(--sun);outline-offset:2px}
.pn .secili{background:var(--sun);color:#2a1d00;border-color:var(--sun)}
.pn .birincil{background:var(--sun);color:#2a1d00;border-color:var(--sun)}
.pn .genis{grid-column:span 5}
.pn .buyuk-btn{width:100%;font-size:18px;padding:18px;background:linear-gradient(135deg,var(--glow),var(--mint));color:#04211f;border:0}
.pn-row{display:flex;gap:8px;flex-wrap:wrap}
.pn-row > *{flex:1 1 auto}
.pn input[type=text],.pn textarea,.pn select{width:100%;font:700 16px var(--govde);color:var(--ink);background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:12px;margin-bottom:10px}
.pn textarea{min-height:76px;resize:vertical}
.pn label.alan{display:block;font:700 13px var(--govde);opacity:.8;margin:0 0 6px}
.pn-yuk{font:700 14px var(--govde);margin-top:10px;min-height:1px}
.pn-cubuk{height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:6px}
.pn-cubuk i{display:block;height:100%;width:0;background:var(--mint);transition:width .3s}
.pn-thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pn-thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#000}
.pn-thumb img{width:100%;height:100%;object-fit:cover}
.pn-thumb .oynat{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;font-size:12px;pointer-events:none}
.pn-thumb .rozet{position:absolute;left:4px;top:4px;background:var(--sun);color:#2a1d00;font:800 10px var(--disp);padding:2px 6px;border-radius:99px}
.pn-thumb button{position:absolute;right:4px;top:4px;min-height:0;width:30px;height:30px;padding:0;border-radius:50%;background:rgba(0,0,0,.65);font-size:14px}
.pn-bos{opacity:.7;font-size:14px;grid-column:1/-1;margin:0}
.pn-okullar{display:flex;flex-wrap:wrap;gap:8px}
.pn-okul{display:flex;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.18)}
.pn .pn-okul button{border:0;border-radius:0;background:rgba(255,255,255,.08)}
.pn .pn-okul button.sil{min-width:40px;padding:0 10px;background:rgba(0,0,0,.25);font-size:14px}
.pn .pn-okul.secili button{background:var(--sun);color:#2a1d00}
.pn .pn-okul.secili button.sil{background:rgba(0,0,0,.15)}
.pn-kucuk{font-size:13px;opacity:.75;line-height:1.5;margin:8px 0 0}
.pn-kucuk code{background:rgba(0,0,0,.3);padding:1px 5px;border-radius:5px;word-break:break-all}
.pn details summary{cursor:pointer;font:800 15px var(--disp);padding:4px 0}
.tost{position:fixed;left:50%;bottom:max(24px, env(safe-area-inset-bottom));transform:translate(-50%,40px);opacity:0;background:var(--ink);color:var(--bg1);font:800 15px var(--disp);padding:12px 18px;border-radius:14px;z-index:200;transition:.35s;max-width:90vw;text-align:center;pointer-events:none}
.tost.acik{opacity:1;transform:translate(-50%,0)}
.pin-ekran{max-width:340px;margin:20vh auto 0;text-align:center;padding:16px}
.pin-ekran input{text-align:center;letter-spacing:.4em;font-size:24px !important}

@media (prefers-reduced-motion: reduce){
  .aurora,.avatar::before,.ikon-tas,.halka::before,.nefes,.katman .dev-emoji{animation:none}
  .harf{animation:none}
}
</style>
</head>
<body>

<div id="tahta" aria-label="Bilişim sınıfı canlı tahta ekranı">
  <div class="aurora a1"></div><div class="aurora a2"></div><div class="aurora a3"></div>
  <canvas id="cv"></canvas>
  <div class="sol-perde"></div>
  <div id="fotoKatman"></div>

  <div class="ust">
    <div>
      <div class="marka">
        <div class="marka-ikon">&lt;/&gt;</div>
        <div><b>Bilişim Sınıfı</b><small id="okulYazi">Değişim Koleji</small></div>
      </div>
      <div id="pin"><span>📌</span><span id="pinYazi"></span></div>
    </div>
    <div class="saat">
      <b id="saat">--:--</b>
      <small id="tarih"></small>
      <span class="sinif-cip" id="sinifCip">Bilişim Sınıfı</span>
    </div>
  </div>

  <main class="sahne" id="sahne"></main>
  <div class="ilerleme"><i id="ilerleme"></i></div>

  <div class="katman" id="yeniFotoKatman"></div>
  <div class="katman" id="olayKatman"></div>
  <div class="katman" id="sessizKatman">
    <div class="katman-ic">
      <div class="nefes">🤫</div>

<script>
/* =====================================================================
   AYARLAR — Telefondan anlık gönderim için Firebase bilgini buraya yapıştır.
   (Diğer uygulamalarında kullandığın firebaseConfig nesnesinin aynısı.)
   Boş bırakırsan uygulama "yerel mod"da çalışır: tahtanın kendisinden
   fotoğraf eklenir, telefon bağlantısı olmaz.
   ===================================================================== */
const AYAR = {
  FIREBASE_CONFIG: null,
  /* örnek:
  FIREBASE_CONFIG: {
    apiKey: "....", authDomain: "....firebaseapp.com", projectId: "....",
    storageBucket: "....", messagingSenderId: "....", appId: "...."
  },
  */
  ODA: 'bilisim-sinifi',     // tahta ve telefon aynı odayı dinler
  PANEL_PIN: ''              // istersen kumandaya şifre koy, örn. '1923'
};

/* ============ YARDIMCILAR ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qs = new URLSearchParams(location.search);
const ODA = (qs.get('oda') || AYAR.ODA).replace(/[^\w-]/g,'').slice(0,40) || 'bilisim-sinifi';
const URL_OKUL = (qs.get('okul') || '').trim().slice(0,40);
const PANEL_MODU = qs.has('panel') || location.hash === '#panel';
const AZ_HAREKET = matchMedia('(prefers-reduced-motion: reduce)').matches;
const VARSAYILAN = { sinif:'genel', tema:'selale', ogretmenAdi:'Barış Öğretmen', okulAdi:'Değişim Koleji', okullar:['Değişim Koleji'],
  duyuru:'', duyuruBitis:0, sessiz:false, olay:null };
function yeniId(){ return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2)); }
function tost(m){ const t=$('#tost'); t.textContent=m; t.classList.add('acik'); clearTimeout(tost._z); tost._z=setTimeout(()=>t.classList.remove('acik'),2800); }
function yukleScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Yüklenemedi: '+src)); document.head.appendChild(s); }); }
function configCoz(metin){
  if(!metin) return null;
  let s = metin.slice(metin.indexOf('{'), metin.lastIndexOf('}')+1);
  s = s.replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,\s*}/g,'}');
  const o = JSON.parse(s); if(!o.projectId || !o.apiKey) throw new Error('projectId/apiKey eksik'); return o;
}

/* ============ VERİ DEPOSU (Bulut: Firestore · Yerel: IndexedDB) ============ */
const Store = {
  bulut:false, hazir:false, state:{...VARSAYILAN}, fotolar:[], dn:{state:[], foto:[]},
  on(k,f){ this.dn[k].push(f); if(this.hazir) f(k==='state'?this.state:this.fotolar); },
  emit(k){ this.dn[k].forEach(f=>{ try{ f(k==='state'?this.state:this.fotolar); }catch(e){ console.error(e); } }); },

  async init(){
    let cfg = AYAR.FIREBASE_CONFIG;
    if(!cfg){ try{ cfg = JSON.parse(localStorage.getItem('bt_fb')||'null'); }catch(e){} }
    if(cfg){
      try{ await this.bulutKur(cfg); this.bulut=true; }
      catch(e){ console.warn('Bulut bağlantısı kurulamadı, yerel moda geçiliyor', e); await this.yerelKur(); }
    } else await this.yerelKur();
    this.hazir = true; this.emit('state'); this.emit('foto');
  },

  async bulutKur(cfg){
    await yukleScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
    await yukleScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
    const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(cfg);
    const db = firebase.firestore(app);
    this.ref = db.collection('bilisim_tahta').doc(ODA);
    this.fotoRef = this.ref.collection('fotolar');
    await new Promise((res, rej) => {
      let ilk = true;
      this.ref.onSnapshot(s => {
        this.state = {...VARSAYILAN, ...(s.data()||{})};
        if(ilk){ ilk=false; res(); } else this.emit('state');
      }, err => { if(ilk){ ilk=false; rej(err); } else console.warn(err); });
    });
    await new Promise(res => {
      let ilk = true;
      this.fotoRef.orderBy('t','desc').limit(80).onSnapshot(q => {
        this.fotolar = q.docs.map(d => ({id:d.id, ...d.data()}));
        if(ilk){ ilk=false; res(); } else this.emit('foto');
      }, err => { console.warn(err); if(ilk){ ilk=false; res(); } });
    });
  },
  async yerelKur(){
    try{ this.state = {...VARSAYILAN, ...JSON.parse(localStorage.getItem('bt_state_'+ODA)||'{}')}; }catch(e){}
    this.fotolar = await idbTum();
    try{
      this.kanal = new BroadcastChannel('bt_'+ODA);
      this.kanal.onmessage = async ev => {
        if(ev.data==='state'){ try{ this.state={...VARSAYILAN,...JSON.parse(localStorage.getItem('bt_state_'+ODA)||'{}')}; }catch(e){} this.emit('state'); }
        if(ev.data==='foto'){ this.fotolar = await idbTum(); this.emit('foto'); }
      };
    }catch(e){}
  },
  async setState(p){
    if(this.bulut) return this.ref.set(p, {merge:true});
    this.state = {...this.state, ...p};
    try{ localStorage.setItem('bt_state_'+ODA, JSON.stringify(this.state)); }catch(e){}
    this.kanal && this.kanal.postMessage('state'); this.emit('state');
  },
  async addFoto(o){
    if(this.bulut) return this.fotoRef.add(o);
    const k = {id:yeniId(), oda:ODA, ...o}; await idbPut(k);
    this.fotolar = await idbTum(); this.kanal && this.kanal.postMessage('foto'); this.emit('foto');
  },
  // Video: Firestore'da 900 KB'lık parçalar halinde (Storage / ücretli plan gerekmez)
  async addVideo(file, meta, ilerle){
    if(this.bulut){
      const id = yeniId(), doc = this.fotoRef.doc(id), buf = new Uint8Array(await file.arrayBuffer()), P = 900000, n = Math.ceil(buf.length/P);
      for(let i=0;i<n;i++){
        await doc.collection('parca').doc(String(i).padStart(4,'0')).set({ d: firebase.firestore.Blob.fromUint8Array(buf.subarray(i*P,(i+1)*P)) });
        ilerle && ilerle((i+1)/n);
      }
      return doc.set({ ...meta, video:{ parca:n, tip:file.type || 'video/mp4', boyut:buf.length } });
    }
    const k = { id:yeniId(), oda:ODA, ...meta, video:{ parca:1, tip:file.type || 'video/mp4', boyut:file.size }, videoBlob:file };
    await idbPut(k); ilerle && ilerle(1);
    this.fotolar = await idbTum(); this.kanal && this.kanal.postMessage('foto'); this.emit('foto');
  },
  async delFoto(id){
    if(this.bulut){
      const f = this.fotolar.find(x => x.id === id);
      if(f && f.video){ const q = await this.fotoRef.doc(id).collection('parca').get(); await Promise.all(q.docs.map(d => d.ref.delete())); }
      return this.fotoRef.doc(id).delete();
    }
    await idbDel(id); this.fotolar = await idbTum(); this.kanal && this.kanal.postMessage('foto'); this.emit('foto');
  }
};
let _db=null;
function idbAc(){ if(_db) return Promise.resolve(_db); return new Promise((res,rej)=>{ const r=indexedDB.open('bilisim_tahta',2);
  r.onupgradeneeded=()=>{ const d=r.result; if(!d.objectStoreNames.contains('fotolar')) d.createObjectStore('fotolar',{keyPath:'id'}); if(!d.objectStoreNames.contains('onbellek')) d.createObjectStore('onbellek'); }; r.onsuccess=()=>{_db=r.result;res(_db);}; r.onerror=()=>rej(r.error); }); }
async function idbTum(){ try{ const db=await idbAc(); return await new Promise(res=>{ const q=db.transaction('fotolar').objectStore('fotolar').getAll();
  q.onsuccess=()=>res(q.result.filter(x=>x.oda===ODA).sort((a,b)=>b.t-a.t)); q.onerror=()=>res([]); }); }catch(e){ return []; } }
async function idbPut(o){ const db=await idbAc(); return new Promise((res,rej)=>{ const tx=db.transaction('fotolar','readwrite'); tx.objectStore('fotolar').put(o); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }
async function onbellekAl(id){ try{ const db=await idbAc(); return await new Promise(res=>{ const q=db.transaction('onbellek').objectStore('onbellek').get(id); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); }); }catch(e){ return null; } }
async function onbellekKoy(id,blob){ try{ const db=await idbAc(); db.transaction('onbellek','readwrite').objectStore('onbellek').put(blob,id); }catch(e){} }
async function onbellekBuda(tutulacak){ try{ const db=await idbAc(); const st=db.transaction('onbellek','readwrite').objectStore('onbellek'); const q=st.getAllKeys(); q.onsuccess=()=>q.result.forEach(k=>{ if(!tutulacak.has(k)) st.delete(k); }); }catch(e){} }
async function idbDel(id){ const db=await idbAc(); return new Promise((res,rej)=>{ const tx=db.transaction('fotolar','readwrite'); tx.objectStore('fotolar').delete(id); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }

/* ============ MEDYA (fotoğraf + video) ============ */
const Medya = {
  url:{}, bekle:{},
  async getir(f){
    if(!f || !f.video || this.url[f.id] || this.bekle[f.id]) return;
    this.bekle[f.id] = 1;
    try{
      let blob = f.videoBlob || await onbellekAl(f.id);
      if(!blob && Store.bulut){
        const q = await Store.fotoRef.doc(f.id).collection('parca').get();
        const parcalar = q.docs.sort((a,b) => a.id < b.id ? -1 : 1).map(d => d.data().d.toUint8Array());
        if(parcalar.length === f.video.parca){ blob = new Blob(parcalar, { type:f.video.tip || 'video/mp4' }); onbellekKoy(f.id, blob); }
      }
      if(blob){ this.url[f.id] = URL.createObjectURL(blob); this.yukselt(f.id); }
    }catch(e){ console.warn('Video alınamadı', e); }
    finally{ delete this.bekle[f.id]; }
  },
  yukselt(id){
    document.querySelectorAll('img[data-vid]').forEach(img => { if(img.dataset.vid === id) img.replaceWith(videoEl(this.url[id], img.getAttribute('src'))); });
  }
};
function videoEl(src, poster){
  const v = document.createElement('video'); v.muted = true; v.defaultMuted = true; v.loop = true; v.autoplay = true; v.playsInline = true;
  v.setAttribute('playsinline',''); v.setAttribute('muted',''); if(poster) v.poster = poster; v.src = src;
  v.play && v.play().catch(()=>{}); return v;
}
function medyaHTML(f){
  if(f.video){
    const u = Medya.url[f.id];
    if(u) return `<video src="${u}" poster="${f.veri}" muted autoplay loop playsinline></video>`;
    Medya.getir(f); return `<img src="${f.veri}" data-vid="${esc(f.id)}" alt="">`;
  }
  return `<img src="${f.veri}" alt="">`;
}
// video oynatılamazsa (örn. tahta bilgisayarı HEVC açamıyorsa) kapak resmine dön
document.addEventListener('error', e => {
  const v = e.target; if(v && v.tagName === 'VIDEO' && v.poster){ const i = document.createElement('img'); i.src = v.poster; i.alt = ''; v.replaceWith(i); }
}, true);
// inner HTML ile eklenen videoları sessizce başlat
new MutationObserver(m => m.forEach(x => x.addedNodes.forEach(n => {
  if(n.querySelectorAll) n.querySelectorAll('video').forEach(v => { v.muted = true; v.play && v.play().catch(()=>{}); });
}))).observe(document.documentElement, { childList:true, subtree:true });

  }
  function boyut(){

  function damlaSifirla(d, g, ilk){
    d.x = g.x0 + R()*(g.x1-g.x0); d.y = ilk ? g.top + R()*(g.pool-g.top) : g.top - R()*40*dpr;
    d.vy = (60 + R()*120)*dpr; d.glif = R()<0.22 ? GLIF[(R()*GLIF.length)|0] : null; d.a = .25 + R()*.55; d.w = (1+R()*1.6)*dpr;
  }
  function kur(){

    for(let i=0;i<n;i++) serit.push({ x:g.x0+(i+R())*(g.x1-g.x0)/n, w:(1+R()*3.2)*dpr, dash:[(30+R()*140)*dpr,(14+R()*90)*dpr], sp:(160+R()*260)*dpr, faz:R()*1000, a:.07+R()*.26, sal:R()*6 });

    sis = []; for(let i=0;i<Math.round(28*az);i++) sis.push({ x:g.x0-60*dpr+R()*(g.x1-g.x0+120*dpr), y:g.pool-(R()*0.07-0.02)*H, r:(50+R()*150)*dpr, vx:(R()-.5)*14*dpr, a:.05+R()*.12 });
    yildiz = []; for(let i=0;i<Math.round(130*az);i++) yildiz.push({ x:R()*W, y:R()*H*0.75, r:(R()*1.4+.3)*dpr, f:R()*6.28, h:.5+R()*1.6 });
    kayaL = kayaNokta(g,true); kayaR = kayaNokta(g,false);
    dudak = []; const m = 14; for(let i=0;i<=m;i++){ const x = g.x0 - 0.02*W + (g.x1-g.x0+0.04*W)*i/m; dudak.push([x, g.top - (0.012 + R()*0.02)*H]); }
    sisSprite = document.createElement('canvas'); sisSprite.width = sisSprite.height = 128;
    const sc = sisSprite.getContext('2d'); const rg = sc.createRadialGradient(64,64,0,64,64,64);
    rg.addColorStop(0,'rgba(255,255,255,1)'); rg.addColorStop(1,'rgba(255,255,255,0)'); sc.fillStyle = rg; sc.fillRect(0,0,128,128);

  function kayaNokta(g, sol){
    // dış kenar: kaba, katmanlı kaya; iç kenar: suyun kenarını örter
    const s = sol?-1:1, x = sol?g.x0:g.x1, dis = [], ic = [];

    for(let i=0;i<=n;i++){
      const k = i/n, y = H - k*(H - (g.top-0.035*H));

  function yumusakYol(p){
    cx.beginPath(); cx.moveTo(p[0][0],p[0][1]);
    for(let i=1;i<p.length-1;i++){ const mx=(p[i][0]+p[i+1][0])/2, my=(p[i][1]+p[i+1][1])/2; cx.quadraticCurveTo(p[i][0],p[i][1],mx,my); }
    cx.lineTo(p[p.length-1][0],p[p.length-1][1]); cx.closePath();

  function dalga(xCss){

    for(let i=0;i<10;i++) sicrama.push({ x, y:g.pool, vx:(R()-.5)*120*dpr, vy:-(80+R()*160)*dpr, l:1 });
  }
  function konfeti(n){
    if(AZ_HAREKET) n = Math.round(n*.3);
    for(let i=0;i<n;i++) konf.push({ x:W*(0.12+R()*0.8), y:-R()*H*0.3, vx:(R()-.5)*80*dpr, vy:(80+R()*160)*dpr, w:(6+R()*8)*dpr, h:(10+R()*12)*dpr, r:R()*6.28, vr:(R()-.5)*8, c:konfRenk[(R()*konfRenk.length)|0], sal:R()*6.28 });

    cx.clearRect(0,0,W,H);

    // şelale gövdesi
    let gr = cx.createLinearGradient(0,g.top,0,g.pool);
    gr.addColorStop(0, rgba(su,.42)); gr.addColorStop(.45, rgba(su,.16)); gr.addColorStop(1, rgba(su,.34));
    cx.fillStyle = gr; cx.fillRect(g.x0, g.top, g.x1-g.x0, g.pool-g.top);
    const yan = cx.createLinearGradient(g.x0,0,g.x1,0);
    yan.addColorStop(0,'rgba(0,0,0,.35)'); yan.addColorStop(.2,'rgba(0,0,0,0)'); yan.addColorStop(.8,'rgba(0,0,0,0)'); yan.addColorStop(1,'rgba(0,0,0,.35)');
    cx.fillStyle = yan; cx.fillRect(g.x0, g.top, g.x1-g.x0, g.pool-g.top);

    // akan şeritler
    cx.lineCap = 'round';
    for(const st of serit){
      st.faz += s*st.sp;
      cx.strokeStyle = `rgba(${Math.min(255,su[0]+90)},${Math.min(255,su[1]+40)},${Math.min(255,su[2]+40)},${st.a})`;
      cx.lineWidth = st.w; cx.setLineDash(st.dash); cx.lineDashOffset = -st.faz;

    for(const d of damla){
      d.vy += 220*dpr*s; d.y += d.vy*s;
      if(d.y > g.pool){ if(R()<.25) sicrama.push({x:d.x,y:g.pool,vx:(R()-.5)*90*dpr,vy:-(60+R()*120)*dpr,l:1}); damlaSifirla(d,g,false); continue; }
      if(d.glif){ cx.fillStyle = `rgba(255,255,255,${d.a*.7})`; cx.fillText(d.glif, d.x, d.y); }

    let pg = cx.createRadialGradient((g.x0+g.x1)/2, g.pool, 0, (g.x0+g.x1)/2, g.pool, (g.x1-g.x0)*.85);
    pg.addColorStop(0, rgba(su,.45)); pg.addColorStop(.5, rgba(su,.12)); pg.addColorStop(1, rgba(su,0));
    cx.save(); cx.translate(0, g.pool); cx.scale(1,.22); cx.translate(0,-g.pool);
    cx.fillStyle = pg; cx.beginPath(); cx.arc((g.x0+g.x1)/2, g.pool, (g.x1-g.x0)*.85, 0, 6.283); cx.fill(); cx.restore();
    const alt = cx.createLinearGradient(0,g.pool,0,H); alt.addColorStop(0, rgba(su,.18)); alt.addColorStop(1, rgba(su,0));
    cx.fillStyle = alt; cx.fillRect(g.x0-0.04*W, g.pool, g.x1-g.x0+0.08*W, H-g.pool);
    for(let i=0;i<5;i++){ const yy = g.pool + (12+i*16)*dpr; const ww = (g.x1-g.x0)*(.9-i*.12); const xx = (g.x0+g.x1)/2 - ww/2 + Math.sin(t*.9+i)*10*dpr;
      cx.fillStyle = `rgba(255,255,255,${.12-i*.02})`; cx.fillRect(xx, yy, ww, 1.5*dpr); }

    // halkalar
    cx.lineWidth = 1.5*dpr;
    for(let i=halkalar.length-1;i>=0;i--){ const h=halkalar[i]; h.r += 60*dpr*s; h.a -= .45*s; if(h.a<=0){ halkalar.splice(i,1); continue; }
      cx.strokeStyle = `rgba(255,255,255,${h.a})`; cx.beginPath(); cx.ellipse(h.x, g.pool+6*dpr, h.r, h.r*.22, 0, 0, 6.283); cx.stroke(); }
    if(R() < .12*hiz) halkalar.push({ x:g.x0+R()*(g.x1-g.x0), r:3*dpr, a:.4 });

    // sıçramalar
    cx.fillStyle = 'rgba(255,255,255,.75)';
    for(let i=sicrama.length-1;i>=0;i--){ const p=sicrama[i]; p.vy += 420*dpr*s; p.x += p.vx*s; p.y += p.vy*s; p.l -= 1.3*s; if(p.l<=0||p.y>g.pool+20*dpr){ sicrama.splice(i,1); continue; } cx.globalAlpha = p.l; cx.fillRect(p.x, p.y, 2.2*dpr, 2.2*dpr); }
    cx.globalAlpha = 1; if(sicrama.length > 400) sicrama.splice(0, sicrama.length-400);

    for(const k of [kayaL, kayaR]){
      yumusakYol(k); const kg = cx.createLinearGradient(0,g.top,0,H); kg.addColorStop(0,kaya2); kg.addColorStop(1,kaya1);

    cx.fillStyle = dg; cx.fill(); cx.strokeStyle = rgba(su,.3); cx.lineWidth = 2*dpr; cx.stroke();
    const kopuk = cx.createLinearGradient(0,g.top+0.012*H,0,g.top+0.07*H); kopuk.addColorStop(0,'rgba(255,255,255,.55)'); kopuk.addColorStop(1,'rgba(255,255,255,0)');

      cx.save(); cx.translate(c.x,c.y); cx.rotate(c.r); cx.fillStyle = c.c; cx.fillRect(-c.w/2,-c.h/2,c.w,c.h*Math.abs(Math.cos(c.sal))); cx.restore(); }
  }
  addEventListener('resize', () => { clearTimeout(boyut._z); boyut._z = setTimeout(boyut, 200); });
  return {

})();

/* ============ KUMANDA PANELİ ============ */
async function sikistir(file, max, q){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Bu fotoğraf açılamadı')); i.src = url; });
    const o = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth*o); c.height = Math.round(img.naturalHeight*o);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    let d = c.toDataURL('image/jpeg', q);
    while(d.length > 800000 && q > .35){ q -= .1; d = c.toDataURL('image/jpeg', q); }
    return d;
  } finally { URL.revokeObjectURL(url); }
}
const VIDEO_MB = 40, VIDEO_ADET = 8;
function videoMu(f){ return (f.type || '').startsWith('video/') || /\.(mp4|mov|m4v|webm|3gp)$/i.test(f.name || ''); }
function videoKontrol(f){ if(f.size > VIDEO_MB*1024*1024){ const e = new Error(`Video çok büyük (${Math.round(f.size/1048576)} MB). En fazla ${VIDEO_MB} MB; telefonda kırpıp tekrar dene.`); e.kullanici = true; throw e; } }
async function videoKapak(file){
  const yedek = () => { const c = document.createElement('canvas'); c.width = 800; c.height = 600; const x = c.getContext('2d');
    const g = x.createLinearGradient(0,0,800,600); g.addColorStop(0,'#0B3A47'); g.addColorStop(1,'#5FE3E0'); x.fillStyle = g; x.fillRect(0,0,800,600);
    x.fillStyle = 'rgba(255,255,255,.9)'; x.beginPath(); x.moveTo(350,220); x.lineTo(350,380); x.lineTo(480,300); x.closePath(); x.fill(); return c.toDataURL('image/jpeg',.8); };
  const url = URL.createObjectURL(file);
  try{
    const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.setAttribute('playsinline',''); v.preload = 'auto'; v.src = url;
    v.play().catch(()=>{});
    await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = rej; setTimeout(rej, 12000); });
    v.pause(); v.currentTime = Math.min(1, (v.duration || 0)/3);
    await new Promise(res => { v.onseeked = res; setTimeout(res, 3000); });
    if(!v.videoWidth) return yedek();
    const o = Math.min(1, 900/Math.max(v.videoWidth, v.videoHeight)); const c = document.createElement('canvas');
    c.width = Math.round(v.videoWidth*o); c.height = Math.round(v.videoHeight*o); c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', .75);
  } catch(e){ return yedek(); }
  finally{ URL.revokeObjectURL(url); }
}
function hataMetni(e){
  const k = (e && (e.code || e.message)) || '';
  if(/permission/i.test(k)) return 'İzin yok: Firestore kurallarında bilisim_tahta koleksiyonuna yazma izni ver.';
  if(/unavailable|network/i.test(k)) return 'İnternet bağlantısı yok. Bağlanınca tekrar dene.';
  return 'Gönderilemedi: ' + k;
}
